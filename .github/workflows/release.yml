name: Release APK

# Push a tag such as v0.1.0 to build, sign and publish a GitHub Release with the APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret: building without Firebase (no usage statistics, no Remote Config)"
          fi

      - name: Build signed release APK and app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease bundleRelease -PappVersionName="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ReelGuard-${GITHUB_REF_NAME}.apk"
          # The .aab is what Google Play takes (see docs/PLAY_STORE.md); people install the .apk.
          cp app/build/outputs/bundle/release/*.aab "dist/ReelGuard-${GITHUB_REF_NAME}.aab"
          (cd dist && sha256sum "ReelGuard-${GITHUB_REF_NAME}.apk" > "ReelGuard-${GITHUB_REF_NAME}.apk.sha256")

      - name: Remove signing material and Firebase config
        if: always()
        run: rm -f keystore.properties app/google-services.json "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ReelGuard $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download the APK below, open it, and allow installs from your browser or file manager when Android asks. Verify with the .sha256 file. On Android 13+ you may need to allow restricted settings before enabling the accessibility service (see the README)."
